[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-transparency"
version = "1.3.1"
description = "Price-anomaly and red-flag detection for Colombian public procurement (SECOP II)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "ofiscal" }]
# Dependency policy (see docs/DEPENDENCIES.md):
# * only MINIMUM versions, no upper caps -> you can upgrade any package;
# * the minimums are tested in CI ("lowest" job), the newest releases in the
#   "latest" job, and uv.lock records the exact set that is known to work.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "xgboost>=2.0.3",  # 2.0.0-2.0.2: pseudo-Huber evaluation bug
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.15.4",   # older typer breaks with click >= 8.2 (--help crashes)
    "joblib>=1.3",
    "openpyxl>=3.1",   # Excel outputs and official records published as .xlsx
    "streamlit>=1.50", # dashboard (core: `uv sync` gives a working app)
    "truststore>=0.9",  # HTTPS with the operating-system certificate store (proxies, uv Pythons)
]

[project.optional-dependencies]
# Experiment tracking (optional; the pipeline runs without it)
mlflow = ["mlflow>=2.10"]
# Transformer text embeddings + zero-shot sustainability classifier (large download)
nlp = ["sentence-transformers>=2.2", "transformers>=4.36", "torch>=2.1"]
# Kept for backwards compatibility: streamlit is now a core dependency.
app = []

# Development tools (PEP 735). `uv sync` installs this group by default;
# with pip >= 25.1: `pip install --group dev`.
[dependency-groups]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
ct = "contract_transparency.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contract_transparency = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end tests that train small models (deselect with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's documented pattern is `param: T = typer.Option(...)`.
"src/contract_transparency/cli.py" = ["B008"]
"tests/*" = ["N803", "N806"]

[tool.coverage.run]
source = ["contract_transparency"]
omit = ["*/app/*"]
